<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    />
    <meta name="theme-color" content="#060a14" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-mark.svg" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="UMI Apps — Hasanath and thoughtful apps for everyday life"
    />
    <meta
      property="og:description"
      content="Hasanath, our flagship for salah, Qur’an and good deeds, plus thoughtful apps for learning, writing, health and the web. Founded by Mohammed Irfan U."
    />
    <meta property="og:image" content="/logo-mark.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Paint the saved theme before React mounts so there is no flash of the
      // wrong background. Dark is the default.
      (function () {
        try {
          var saved = localStorage.getItem('umi-theme');
          document.documentElement.setAttribute(
            'data-theme',
            saved === 'light' ? 'light' : 'dark'
          );
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
